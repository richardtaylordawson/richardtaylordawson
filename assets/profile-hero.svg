<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Taylor Dawson profile hero</title>
  <desc id="desc">A dark animated branded hero image with the RTD logo and text for Taylor Dawson.</desc>
  <defs>
    <radialGradient id="pointerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(898 104) rotate(135) scale(520 430)">
      <stop stop-color="#C084FC" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#140C1C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logoGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(903 278) rotate(120) scale(230 180)">
      <stop stop-color="#B8F34A" stop-opacity="0.24"/>
      <stop offset="0.58" stop-color="#C084FC" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#140C1C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelStroke" x1="94" y1="76" x2="1044" y2="469" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#C084FC" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.26"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" stroke="#FFF7F0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="58" y="54" width="1084" height="412" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1200" height="520" fill="#140C1C"/>
  <rect width="1200" height="520" fill="url(#pointerGlow)" opacity="0.78">
    <animate attributeName="opacity" values="0.66;1;0.66" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="-72" y="-72" width="1344" height="664" fill="url(#grid)" opacity="0.74">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-72 -72" dur="18s" repeatCount="indefinite"/>
  </rect>
  <rect x="58" y="54" width="1084" height="412" rx="30" fill="#FFF7F0" fill-opacity="0.035" stroke="url(#panelStroke)" stroke-opacity="0.78" filter="url(#softShadow)">
    <animate attributeName="stroke-opacity" values="0.58;0.9;0.58" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <g clip-path="url(#panelClip)">
    <circle cx="1000" cy="102" r="256" fill="#C084FC" fill-opacity="0.08"/>
    <circle cx="1086" cy="354" r="246" fill="#2DD4BF" fill-opacity="0.075"/>
    <path d="M102 120H704" stroke="#FFF7F0" stroke-opacity="0.07"/>
    <path d="M102 344H544" stroke="#FFF7F0" stroke-opacity="0.07"/>
  </g>

  <g transform="translate(86 188)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="800ms" begin="120ms" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="86 202;86 188" dur="800ms" begin="120ms" fill="freeze"/>
    <text fill="#FFF7F0" font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="700" letter-spacing="0">
      <tspan x="0" y="70">Taylor Dawson.</tspan>
    </text>
  </g>

  <g transform="translate(846 118)">
    <animateTransform attributeName="transform" type="translate" values="846 118;846 108;846 118" dur="5s" repeatCount="indefinite"/>
    <ellipse cx="116" cy="254" rx="116" ry="28" fill="#000000" fill-opacity="0.22"/>
    <rect x="0" y="0" width="232" height="232" rx="30" fill="#C084FC" fill-opacity="0.1" stroke="#C084FC" stroke-opacity="0.42"/>
    <rect x="19" y="19" width="194" height="194" rx="22" fill="#140C1C" fill-opacity="0.58" stroke="#FFF7F0" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="232" height="232" rx="30" fill="url(#logoGlow)"/>
    <svg x="31" y="41" width="172" height="136" viewBox="48 58 470 370" fill="none" aria-hidden="true" focusable="false">
      <path d="M296 92h102q53 0 86 34t33 88v78q0 54-33 88t-86 34H296v-62h86q28 0 46-18t18-47v-68q0-29-18-47t-46-18h-86z" fill="#0C0711" fill-opacity="0.42"/>
      <path d="M280 78h102q53 0 86 34t33 88v78q0 54-33 88t-86 34H280v-62h86q28 0 46-18t18-47v-68q0-29-18-47t-46-18h-86z" fill="#C084FC"/>
      <path d="M96 158h139q32 0 52 19t20 50v49q0 31-20 50t-52 19h-36l70 69h-81l-90-91v-55h108q16 0 26-9t10-25q0-16-10-25t-26-9H96z" fill="#0C0711" fill-opacity="0.42"/>
      <path d="M80 144h139q32 0 52 19t20 50v49q0 31-20 50t-52 19h-36l70 69h-81l-90-91v-55h108q16 0 26-9t10-25q0-16-10-25t-26-9H80z" fill="#2DD4BF"/>
      <path d="M80 78h310v58H266v264h-68V136H80z" fill="#FFF7F0"/>
      <rect x="198" y="364" width="68" height="36" rx="9" fill="#B8F34A"/>
    </svg>
  </g>
  <circle cx="820" cy="146" r="4" fill="#2DD4BF" opacity="0.28">
    <animate attributeName="opacity" values="0.28;1;0.28" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1092" cy="168" r="5" fill="#B8F34A" opacity="0.28">
    <animate attributeName="opacity" values="0.28;1;0.28" dur="2.8s" begin="350ms" repeatCount="indefinite"/>
  </circle>
  <circle cx="824" cy="356" r="3.5" fill="#FFD166" opacity="0.28">
    <animate attributeName="opacity" values="0.28;1;0.28" dur="2.8s" begin="700ms" repeatCount="indefinite"/>
  </circle>
</svg>
